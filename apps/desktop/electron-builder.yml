appId: com.myself.desktop
productName: AI Pet
artifactName: AI-Pet-${version}-windows-${arch}.${ext}
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  - resources/characters/default/**/*
  # 工作区源码已内联到 out；运行期 helper、模型和许可仅经 extraResources 分发。
  - '!node_modules/@myself{,/**/*}'
  - '!node_modules/@opencode-ai{,/**/*}'
  - '!node_modules/**/{test,tests,__tests__,fixtures,ai-docs}{,/**/*}'
  - '!node_modules/pend/test.js'
  - '!node_modules/msgpackr/dist/test.js'
  - '!node_modules/msgpackr/test-worker.js'
extraResources:
  - from: resources/windows/explorer-space-bridge.ps1
    to: windows/explorer-space-bridge.ps1
  - from: resources/windows/explorer-space-shell-tab-helper.cs
    to: windows/explorer-space-shell-tab-helper.cs
  - from: resources/windows/explorer-space-integrity.json
    to: windows/explorer-space-integrity.json
  - from: resources/local-model
    to: local-model
  - from: ../../packages/coding-task-core/dist
    to: coding-task-resources
  - from: ../../vendor/opencode/LICENSE
    to: coding-task-resources/opencode/LICENSE
asar: true
win:
  icon: resources/icon.ico
  signAndEditExecutable: false
