appId: com.myself.desktop
productName: AI Pet
artifactName: AI-Pet-${version}-windows-${arch}.${ext}
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  - resources/characters/default/**/*
extraResources:
  - from: resources/windows/explorer-space-bridge.ps1
    to: windows/explorer-space-bridge.ps1
  - from: resources/windows/explorer-space-shell-tab-helper.cs
    to: windows/explorer-space-shell-tab-helper.cs
  - from: resources/windows/explorer-space-integrity.json
    to: windows/explorer-space-integrity.json
  - from: resources/local-model
    to: local-model
  - from: ../../packages/coding-task-core/dist
    to: coding-task-resources
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
